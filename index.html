
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RFID Production Report</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f3f7fb;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #075985;
            font-size: 30px;
        }

        .header p {
            color: #64748b;
            margin-top: 6px;
        }

        .date-display {
            margin-top: 10px;
            color: #475569;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #334155;
            margin-bottom: 8px;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        select:focus,
        input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.10);
        }

        .section {
            margin-top: 22px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            background: #f8fafc;
        }

        .section h2 {
            font-size: 19px;
            color: #0f172a;
            margin-bottom: 14px;
        }

        .count-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 14px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .preview-btn {
            background: #e2e8f0;
            color: #0f172a;
        }

        .whatsapp-btn {
            background: #25d366;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .message-box {
            display: none;
            margin-top: 20px;
        }

        .message-box textarea {
            width: 100%;
            min-height: 350px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: vertical;
            font-size: 14px;
            line-height: 1.5;
        }

        .required {
            color: red;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 18px;
            }

            .count-row,
            .button-group {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <h1>RFID</h1>
        <p>Daily Production Report</p>

        <div class="date-display" id="currentDate"></div>
    </div>


    <!-- Shift -->
    <div class="form-group">

        <label for="shift">
            Shift <span class="required">*</span>
        </label>

        <select id="shift">
            <option value="">-- Select Shift --</option>
            <option value="1st Shift">1st Shift</option>
            <option value="2nd Shift">2nd Shift</option>
            <option value="3rd Shift">3rd Shift</option>
        </select>

    </div>


    <!-- Product -->
    <div class="form-group">

        <label for="product">
            Product Name <span class="required">*</span>
        </label>

        <select id="product">

            <option value="">
                -- Select Product --
            </option>

            <option value="TML">
                TML
            </option>

            <option value="MTBD">
                MTBD
            </option>

        </select>

    </div>


    <!-- Flashing & Primary -->
    <div class="section">

        <h2>Flashing &amp; Primary</h2>

        <div class="count-row">

            <div>

                <label for="flashingOk">
                    OK Count
                </label>

                <input
                    type="text"
                    id="flashingOk"
                   
                >

            </div>

            <div>

                <label for="flashingWip">
                    WIP Count
                </label>

                <input
                    type="text"
                    id="flashingWip"
                   
                >

            </div>

        </div>

    </div>


    <!-- Screwing -->
    <div class="section">

        <h2>Screwing</h2>

        <div class="count-row">

            <div>

                <label for="screwingOk">
                    OK Count
                </label>

                <input
                    type="text"
                    id="screwingOk"
                   
                >

            </div>

            <div>

                <label for="screwingWip">
                    WIP Count
                </label>

                <input
                    type="text"
                    id="screwingWip"
                    
                >

            </div>

        </div>

    </div>


    <!-- Air Leak -->
    <div class="section">

        <h2>Air Leak</h2>

        <div class="count-row">

            <div>

                <label for="airLeakOk">
                    OK Count
                </label>

                <input
                    type="text"
                    id="airLeakOk"
                    
                >

            </div>

            <div>

                <label for="airLeakWip">
                    WIP Count
                </label>

                <input
                    type="text"
                    id="airLeakWip"
                    
                >

            </div>

        </div>

    </div>


    <!-- Final Testing -->
    <div class="section">

        <h2>Final Testing &amp; Sticker Printing </h2>

        <div class="count-row">

            <div>

                <label for="finalTestingOk">
                    OK Count
                </label>

                <input
                    type="text"
                    id="finalTestingOk"
                    
                >

            </div>

            <div>

                <label for="finalTestingWip">
                    WIP Count
                </label>

                <input
                    type="text"
                    id="finalTestingWip"
                   
                >

            </div>

        </div>

    </div>


   


    <!-- FG -->
    <div class="section">

        <h2>FG Count</h2>

        <label for="fgCount">
            Count
        </label>

        <input
            type="text"
            id="fgCount"
           
        >

    </div>


    <!-- Dispatch -->
    <div class="section">

        <h2>Dispatch Count</h2>

        <label for="dispatchCount">
            Dispatch Count
        </label>

        <input
            type="text"
            id="dispatchCount"
           
        >

    </div>


    <!-- Buttons -->
    <div class="button-group">

        <button
            class="preview-btn"
            onclick="generateMessage()">

            Preview Message

        </button>


        <button
            class="whatsapp-btn"
            onclick="sendWhatsApp()">

            Send WhatsApp

        </button>

    </div>


    <!-- Message Preview -->
    <div
        class="message-box"
        id="messageBox">

        <label for="whatsappMessage">
            WhatsApp Message
        </label>

        <textarea
            id="whatsappMessage"
            readonly>
        </textarea>

    </div>

</div>


<script>

    // ================================
    // CURRENT DATE
    // ================================

    function getCurrentDate() {

        const today = new Date();

        const options = {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        };

        return today.toLocaleDateString(
            "en-IN",
            options
        );
    }


    document.getElementById("currentDate").innerText =
        "Date: " + getCurrentDate();


    // ================================
    // GET VALUE
    // ================================

    function getValue(id) {

        const element =
            document.getElementById(id);

        return element.value || "0";

    }


    // ================================
    // GENERATE MESSAGE
    // ================================

    function generateMessage() {

        const shift =
            document.getElementById("shift").value;

        const product =
            document.getElementById("product").value;


        // Shift validation

        if (shift === "") {

            alert("Please select Shift.");

            document.getElementById("shift").focus();

            return "";

        }


        // Product validation

        if (product === "") {

            alert("Please select Product Name.");

            document.getElementById("product").focus();

            return "";

        }


        const currentDate =
            getCurrentDate();


        // ================================
        // WHATSAPP MESSAGE
        // ================================

        const message =
`RFID DAILY PRODUCTION REPORT

Product Name :- ${product}

Date: ${currentDate} -- ( ${shift} )

Flashing & Primary
OK Count :- ${getValue("flashingOk")}
WIP Count :- ${getValue("flashingWip")}

Screwing
OK Count :- ${getValue("screwingOk")}
WIP Count :- ${getValue("screwingWip")}

Air Leak
OK Count :- ${getValue("airLeakOk")}
WIP Count :- ${getValue("airLeakWip")}

Final Testing & Sticker Printing
OK Count :- ${getValue("finalTestingOk")}
WIP Count :- ${getValue("finalTestingWip")}




FG Count :- ${getValue("fgCount")}


Dispatch Count :- ${getValue("dispatchCount")}`;



        // Show message

        document.getElementById(
            "whatsappMessage"
        ).value = message;


        document.getElementById(
            "messageBox"
        ).style.display = "block";


        return message;

    }


    // ================================
    // SEND WHATSAPP
    // ================================

    function sendWhatsApp() {

        const message =
            generateMessage();


        if (!message) {

            return;

        }


        const whatsappUrl =
            "https://wa.me/?text=" +
            encodeURIComponent(message);


        window.open(
            whatsappUrl,
            "_blank"
        );

    }

</script>

</body>
</html>
