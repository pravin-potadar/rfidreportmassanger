
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFID Production Report</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f3f7fb;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #075985;
            font-size: 30px;
        }

        .header p {
            color: #64748b;
            margin-top: 6px;
        }

        .date-display {
            margin-top: 10px;
            color: #475569;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #334155;
            margin-bottom: 8px;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: #0284c7;
        }

        .section {
            margin-top: 22px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            background: #f8fafc;
        }

        .section h2 {
            font-size: 19px;
            color: #0f172a;
            margin-bottom: 14px;
        }

        .count-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 14px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .preview-btn {
            background: #e2e8f0;
            color: #0f172a;
        }

        .whatsapp-btn {
            background: #25d366;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .message-box {
            display: none;
            margin-top: 20px;
        }

        .message-box textarea {
            width: 100%;
            min-height: 300px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: vertical;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 18px;
            }

            .count-row,
            .button-group {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>RFID</h1>
        <p>Production Report</p>

        <!-- Current Date -->
        <div class="date-display" id="currentDate"></div>
    </div>

    <!-- Product -->
    <div class="form-group">
        <label for="product">Product Name</label>
        <select id="product">
            <option value="">-- Select Product --</option>
            <option value="TML">TML</option>
            <option value="MTBD">MTBD</option>
        </select>
    </div>

    <!-- Flashing & Primary -->
    <div class="section">
        <h2>Flashing &amp; Primary</h2>

        <div class="count-row">
            <div>
                <label for="flashingOk">OK Count</label>
                <input type="number" id="flashingOk" min="0" value="0">
            </div>

            <div>
                <label for="flashingWip">WIP Count</label>
                <input type="number" id="flashingWip" min="0" value="0">
            </div>
        </div>
    </div>

    <!-- Screwing -->
    <div class="section">
        <h2>Screwing</h2>

        <div class="count-row">
            <div>
                <label for="screwingOk">OK Count</label>
                <input type="number" id="screwingOk" min="0" value="0">
            </div>

            <div>
                <label for="screwingWip">WIP Count</label>
                <input type="number" id="screwingWip" min="0" value="0">
            </div>
        </div>
    </div>

    <!-- Air Leak -->
    <div class="section">
        <h2>Air Leak</h2>

        <div class="count-row">
            <div>
                <label for="airLeakOk">OK Count</label>
                <input type="number" id="airLeakOk" min="0" value="0">
            </div>

            <div>
                <label for="airLeakWip">WIP Count</label>
                <input type="number" id="airLeakWip" min="0" value="0">
            </div>
        </div>
    </div>

    <!-- Final Testing -->
    <div class="section">
        <h2>Final Testing</h2>

        <div class="count-row">
            <div>
                <label for="finalTestingOk">OK Count</label>
                <input type="number" id="finalTestingOk" min="0" value="0">
            </div>

            <div>
                <label for="finalTestingWip">WIP Count</label>
                <input type="number" id="finalTestingWip" min="0" value="0">
            </div>
        </div>
    </div>

    <!-- Sticker Printing -->
    <div class="section">
        <h2>Sticker Printing</h2>

        <div class="count-row">
            <div>
                <label for="stickerPrintingOk">OK Count</label>
                <input type="number" id="stickerPrintingOk" min="0" value="0">
            </div>

            <div>
                <label for="stickerPrintingWip">WIP Count</label>
                <input type="number" id="stickerPrintingWip" min="0" value="0">
            </div>
        </div>
    </div>

    <!-- FG -->
    <div class="section">
        <h2>FG Count</h2>

        <label for="fgCount">Count</label>
        <input type="number" id="fgCount" min="0" value="0">
    </div>

    <!-- Buttons -->
    <div class="button-group">

        <button class="preview-btn" onclick="generateMessage()">
            Preview Message
        </button>

        <button class="whatsapp-btn" onclick="sendWhatsApp()">
            Send WhatsApp
        </button>

    </div>

    <!-- Message Preview -->
    <div class="message-box" id="messageBox">

        <label for="whatsappMessage">
            WhatsApp Message
        </label>

        <textarea id="whatsappMessage" readonly></textarea>

    </div>

</div>

<script>

    // Show Current Date on Page
    function getCurrentDate() {

        const today = new Date();

        const options = {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        };

        return today.toLocaleDateString("en-IN", options);
    }

    // Display date at top
    document.getElementById("currentDate").innerText =
        "Date: " + getCurrentDate();


    // Get input value
    function getValue(id) {

        return document.getElementById(id).value || "0";

    }


    // Generate WhatsApp Message
    function generateMessage() {

        const product =
            document.getElementById("product").value;

        if (product === "") {

            alert("Please select Product Name.");

            return "";

        }


        const currentDate = getCurrentDate();


        const message =
`RFID 

Date: ${currentDate}

Product Name: ${product}

Flashing & Primary
OK Count: ${getValue("flashingOk")}
WIP Count: ${getValue("flashingWip")}

Screwing
OK Count: ${getValue("screwingOk")}
WIP Count: ${getValue("screwingWip")}

Air Leak
OK Count: ${getValue("airLeakOk")}
WIP Count: ${getValue("airLeakWip")}

Final Testing
OK Count: ${getValue("finalTestingOk")}
WIP Count: ${getValue("finalTestingWip")}

Sticker Printing
OK Count: ${getValue("stickerPrintingOk")}
WIP Count: ${getValue("stickerPrintingWip")}

FG Count: ${getValue("fgCount")}`;


        document.getElementById("whatsappMessage").value =
            message;

        document.getElementById("messageBox").style.display =
            "block";


        return message;

    }


    // Send WhatsApp
    function sendWhatsApp() {

        const message = generateMessage();

        if (!message) {

            return;

        }


        const whatsappUrl =
            "https://wa.me/?text=" +
            encodeURIComponent(message);


        window.open(whatsappUrl, "_blank");

    }

</script>

</body>
</html>
